# Default application configuration (non-secret).
# Override secrets in config.local.properties (gitignored) or environment variables.

app.name=Fitness Tracking System
app.version=1.0-SNAPSHOT

# SQLite file path. Relative paths resolve against the working directory.
db.path=data/fittrack.db

# USDA FoodData Central API key (override in config.local.properties or USDA_API_KEY).
# DEMO_KEY works for light testing; get a free key at https://fdc.nal.usda.gov/api-key-signup.html
usda.api.key=DEMO_KEY
usda.api.baseUrl=https://api.nal.usda.gov/fdc/v1
